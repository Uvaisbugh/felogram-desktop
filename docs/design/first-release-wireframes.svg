<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1080" viewBox="0 0 1360 1080" role="img" aria-labelledby="title desc">
<title id="title">Felogram first-release interface sketches</title>
<desc id="desc">Four proposed native Windows surfaces: workspace switcher, bookmark panel, search filters and command palette. Synthetic data. These features are not implemented.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#203047;font-size:15px}.title{font-size:28px;font-weight:700}.heading{font-size:20px;font-weight:600}.small{font-size:13px;fill:#54657a}.white{fill:white}.bold{font-weight:600}.muted{fill:#708096}.selected{fill:#1767ad}</style>
<rect width="1360" height="1080" fill="#edf2f7"/>
<text x="32" y="43" class="title">Felogram Desktop · first usable release</text>
<text x="32" y="72" class="small">Design sketches · 7 October 2026 · synthetic conversations · planned features, not screenshots</text><rect x="32" y="98" width="628" height="448" rx="8" fill="#fff" stroke="#d8e1ea"/><text x="52" y="130" class="heading">01  Workspace switcher</text><rect x="48" y="148" width="596" height="350" rx="8" fill="#f8fafc" stroke="#d8e1ea"/><text x="60" y="175" class="bold">Account A · Work</text><rect x="56" y="192" width="210" height="266" rx="8" fill="#fff" stroke="#d8e1ea"/><rect x="64" y="200" width="194" height="36" rx="8" fill="#e4f0fc" stroke="#d8e1ea"/><text x="77" y="224" class="selected bold">Compiler project ▾</text><text x="77" y="258" class="">All chats</text><text x="77" y="294" class="bold">Compiler project</text><text x="77" y="324" class="">Support   ·   3 unread</text><text x="77" y="354" class="">Development / Build</text><text x="77" y="384" class="">Release channel</text><text x="77" y="426" class="selected">+ Manage workspaces</text><text x="290" y="221" class="bold">Development / Build</text><text x="290" y="245" class="small">Compiler project · Account A</text><rect x="284" y="268" width="347" height="60" rx="8" fill="#fff" stroke="#d8e1ea"/><text x="298" y="293" class="">Alex: Build succeeded</text><text x="298" y="315" class="small">Reply remains in this topic</text><rect x="284" y="366" width="347" height="76" rx="8" fill="#fff" stroke="#d8e1ea"/><text x="298" y="392" class="small">Replying to Alex</text><text x="298" y="418" class="">Unsent draft stays here…</text><text x="60" y="522" class="small">Local views only · changing workspaces never sends a message</text><rect x="700" y="98" width="628" height="448" rx="8" fill="#fff" stroke="#d8e1ea"/><text x="720" y="130" class="heading">02  Bookmark panel</text><rect x="716" y="148" width="596" height="350" rx="8" fill="#f8fafc" stroke="#d8e1ea"/><text x="728" y="175" class="bold">Account A · Work</text><rect x="724" y="191" width="245" height="254" rx="8" fill="#fff" stroke="#d8e1ea"/><text x="740" y="218" class="bold">Support chat</text><text x="740" y="252" class="">Synthetic solution</text><rect x="738" y="270" width="215" height="70" rx="8" fill="#edf5fd" stroke="#d8e1ea"/><text x="752" y="296" class="">Fix: include the header</text><text x="752" y="321" class="selected">Bookmark message ☆</text><text x="740" y="419" class="small">Original conversation</text><rect x="980" y="191" width="321" height="254" rx="8" fill="#fff" stroke="#d8e1ea"/><text x="996" y="218" class="bold">Bookmarks</text><text x="996" y="240" class="small">Local to this account</text><rect x="992" y="254" width="296" height="29" rx="8" fill="#f8fafc" stroke="#d8e1ea"/><text x="1004" y="274" class="small">Tag: build   ·   Workspace: all</text><rect x="992" y="294" width="296" height="77" rx="8" fill="#e4f0fc" stroke="#d8e1ea"/><text x="1004" y="315" class="bold">Missing include fix</text><text x="1004" y="337" class="small">Support · Alex · 7 Oct</text><text x="1004" y="359" class="selected">Open original     Edit note</text><text x="996" y="397" class="small">Deleted original: unavailable</text><text x="996" y="422" class="small">Keep or remove local note</text><text x="728" y="522" class="small">No hidden message snapshot · narrow windows use Back navigation</text><rect x="32" y="578" width="628" height="448" rx="8" fill="#fff" stroke="#d8e1ea"/><text x="52" y="610" class="heading">03  Search filters and saved searches</text><rect x="48" y="628" width="596" height="350" rx="8" fill="#f8fafc" stroke="#d8e1ea"/><text x="60" y="655" class="bold">Account A · Work</text><rect x="56" y="672" width="567" height="37" rx="8" fill="#fff" stroke="#d8e1ea"/><text x="72" y="697" class="">linker error</text><rect x="56" y="721" width="175" height="31" rx="8" fill="#e4f0fc" stroke="#d8e1ea"/><text x="67" y="742" class="small">Chat: Compiler support</text><rect x="241" y="721" width="124" height="31" rx="8" fill="#e4f0fc" stroke="#d8e1ea"/><text x="252" y="742" class="small">Sender: Alex</text><rect x="375" y="721" width="248" height="31" rx="8" fill="#e4f0fc" stroke="#d8e1ea"/><text x="386" y="742" class="small">Date: 1–7 Oct   ·   Type: text</text><rect x="56" y="764" width="170" height="35" rx="8" fill="#1767ad" stroke="#d8e1ea"/><text x="70" y="788" class="white bold">Save search…</text><text x="247" y="788" class="selected">Cancel   ·   Saved searches</text><rect x="56" y="812" width="567" height="77" rx="8" fill="#fff" stroke="#d8e1ea"/><text x="72" y="840" class="bold">Alex · Compiler support · 7 Oct</text><text x="72" y="870" class="">Synthetic match: linker error resolved</text><text x="56" y="917" class="small">Results update on each run; offline state offers retry</text><text x="60" y="1002" class="small">Saving stores the query and filters, not a result snapshot</text><rect x="700" y="578" width="628" height="448" rx="8" fill="#fff" stroke="#d8e1ea"/><text x="720" y="610" class="heading">04  Keyboard command palette</text><rect x="716" y="628" width="596" height="350" rx="8" fill="#f8fafc" stroke="#d8e1ea"/><text x="728" y="655" class="bold">Account A · Work</text><text x="730" y="695" class="small">Current chat and unsent draft remain behind the palette</text><rect x="756" y="717" width="523" height="205" rx="8" fill="#fff" stroke="#aabbd0"/><text x="774" y="744" class="small">Account A · Work</text><rect x="771" y="757" width="493" height="34" rx="8" fill="#f8fafc" stroke="#d8e1ea"/><text x="785" y="781" class="">Search actions or destinations…</text><rect x="771" y="801" width="493" height="31" rx="8" fill="#e4f0fc" stroke="#d8e1ea"/><text x="785" y="823" class="selected bold">Open workspace: Compiler project</text><text x="785" y="854" class="">Open bookmarks</text><text x="785" y="885" class="">Rerun search: Build failures</text><text x="730" y="952" class="small">↑ ↓ Select    Enter Open    Esc Return to previous focus</text><text x="728" y="1002" class="small">Proposed Ctrl+K · audit shortcut conflicts before implementation</text><text x="32" y="1052" class="small">All panels: visible account context, keyboard focus, accessible names, empty/error states and scaling checks.</text></svg>
