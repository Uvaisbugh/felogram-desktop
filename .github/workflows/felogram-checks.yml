name: Felogram checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: felogram-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows repository checks
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate contributor contracts and Windows scripts
        shell: pwsh
        run: ./scripts/windows/validate.ps1
      - name: Validate patch whitespace
        shell: pwsh
        run: git diff --check HEAD^
      - name: Verify API configuration and distribution gates without accounts
        shell: pwsh
        run: ./scripts/windows/test-api-gates.ps1
  workspaces:
    name: Workspace model and persistence tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt Core development tools
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev ninja-build
      - name: Build Debug workspace tests
        run: |
          cmake -S scripts/testing/workspaces -B .local/workspace-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build .local/workspace-tests --parallel 2
      - name: Test workspace persistence and account isolation
        run: ctest --test-dir .local/workspace-tests --output-on-failure
